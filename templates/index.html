<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 18px;
            box-sizing: border-box;
        }

        input[type="file"] {
            border: 1px solid #ccc;
            padding: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Registration</h1>

    <form action="/register" method="POST" enctype="multipart/form-data">

        <label for="name">Student Name</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter student name"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter email address"
            required
        >

        <label for="course">Course</label>
        <input
            type="text"
            id="course"
            name="course"
            placeholder="Enter course"
            required
        >

        <label for="photo">Student Photo</label>
        <input
            type="file"
            id="photo"
            name="photo"
            accept="image/*"
            required
        >

        <button type="submit">
            Register Student
        </button>

    </form>

</div>

</body>
</html>
